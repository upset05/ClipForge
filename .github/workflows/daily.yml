
name: ClipForge Cloud Worker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: clipforge-cloud-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Discover, Plan and Render
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pillow moviepy requests numpy

      - name: Verify audio engine
        run: |
          espeak-ng --version
          echo "Audio engine ready."

      - name: Run discovery engine
        run: python discovery/feeds.py

      - name: Run content planner
        run: python content/plan.py

      - name: Render videos with audio
        run: python video/render.py

      - name: Verify rendered videos
        run: |
          echo "Checking generated videos..."
          find output -maxdepth 1 -type f -name "*.mp4" -print
          COUNT=$(find output -maxdepth 1 -type f -name "*.mp4" | wc -l)
          echo "Videos generated: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No videos were generated."
            exit 1
          fi

      - name: Upload ClipForge outputs
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-outputs
          path: |
            reports/
            output/
          if-no-files-found: error
          retention-days: 7
