name: ClipForge Cloud Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run content planner
        run: python content/plan.py
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install discovery dependency
        run: pip install feedparser

      - name: Run discovery engine
        run: python discovery/feeds.py

      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-discovery-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
