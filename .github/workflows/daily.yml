
name: ClipForge Cloud Worker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: clipforge-cloud-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Discover, Plan and Render
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pillow moviepy requests numpy piper-tts

      - name: Download Piper voice model
        run: |
          mkdir -p assets/voices

          curl -L --fail \
            -o assets/voices/en_US-lessac-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx

          curl -L --fail \
            -o assets/voices/en_US-lessac-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json

      - name: Verify Piper
        run: |
          piper --help
          test -s assets/voices/en_US-lessac-medium.onnx
          echo "Piper voice model ready."

      - name: Run discovery engine
        run: python discovery/feeds.py

      - name: Run content planner
        run: python content/plan.py

      - name: Render videos
        run: python video/render.py

      - name: Verify rendered videos
        run: |
          set -e

          find output -maxdepth 1 -type f -name "*.mp4" -print

          COUNT=$(find output -maxdepth 1 -type f -name "*.mp4" | wc -l)

          echo "Videos generated: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No videos were generated."
            exit 1
          fi

      - name: Upload ClipForge outputs
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-outputs
          path: |
            reports/
            output/
          if-no-files-found: error
          retention-days: 7
