
name: ClipForge Cloud Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser pillow moviepy requests

      - name: Run discovery engine
        run: python discovery/feeds.py

      - name: Run content planner
        run: python content/plan.py

      - name: Render videos
        run: python video/render.py

      - name: Upload ClipForge outputs
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-outputs
          path: |
            reports/
            output/
          if-no-files-found: warn
          retention-days: 7
